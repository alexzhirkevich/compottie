#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx4096M"

#Kotlin
kotlin.code.style=official
jvmTarget=11

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.compileSdk=37
